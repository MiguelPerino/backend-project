<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loja MP Fish</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="header">

        <div class="container header-content">

            <div class="brand">

                <img 
                    src="imgs/logo.png" 
                    alt="Logo MP Fish"
                    class="logo"
                >

                <h1>Loja MP Fish</h1>

            </div>

        </div>

    </header>


    <!-- CONTEÚDO -->
    <main>

        <section class="products">

            <div class="container">

                <h2>Peixes</h2>

                <div class="product-grid">


                    <!-- SALMÃO -->
                    <article class="product-card">

                        <img 
                            src="imgs/salmao.png"
                            alt="Salmão"
                            class="product-image"
                        >

                        <h3>Salmão</h3>

                        <p>
                            Filé de salmão fresco.
                        </p>

                        <strong>
                            R$ 59,90
                        </strong>

                        <span>
                            Estoque: 10
                        </span>

                    </article>


                    <!-- PIRARARA -->
                    <article class="product-card">

                        <img 
                            src="imgs/pirara.png"
                            alt="Pirarara"
                            class="product-image"
                        >

                        <h3>Pirarara</h3>

                        <p>
                            Pirarara fresca, ótima para assados.
                        </p>

                        <strong>
                            R$ 34,90
                        </strong>

                        <span>
                            Estoque: 8
                        </span>

                    </article>


                    <!-- TILÁPIA -->
                    <article class="product-card">

                        <img 
                            src="imgs/tilapa.png"
                            alt="Tilápia"
                            class="product-image"
                        >

                        <h3>Tilápia</h3>

                        <p>
                            Filé de tilápia fresco.
                        </p>

                        <strong>
                            R$ 29,90
                        </strong>

                        <span>
                            Estoque: 15
                        </span>

                    </article>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
